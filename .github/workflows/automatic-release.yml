 name: Automatic DLL Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from commit message
        id: version
        shell: bash
        run: |
          COMMIT_MESSAGE="$(git log -1 --pretty=%B)"

          echo "Commit message:"
          echo "$COMMIT_MESSAGE"

          if [[ "$COMMIT_MESSAGE" =~ [Bb]ump[[:space:]]+(v[0-9]+\.[0-9]+\.[0-9]+) ]]; then
            VERSION="${BASH_REMATCH[1]}"

            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"

            echo "Detected version: $VERSION"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "No release version found."
            echo "Expected commit message: Bump v1.0.1"
          fi

      - name: Find release DLL
        if: steps.version.outputs.should_release == 'true'
        id: dll
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          EXPECTED_FILE="release/CrystalGatherer-${VERSION}.dll"

          echo "Looking for: $EXPECTED_FILE"

          if [[ ! -f "$EXPECTED_FILE" ]]; then
            echo "::error::Could not find $EXPECTED_FILE"

            echo "Files currently inside the release folder:"
            find release -maxdepth 2 -type f 2>/dev/null || true

            exit 1
          fi

          echo "path=$EXPECTED_FILE" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$EXPECTED_FILE")" >> "$GITHUB_OUTPUT"

          echo "Found DLL: $EXPECTED_FILE"

      - name: Check whether release already exists
        if: steps.version.outputs.should_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::error::Release $VERSION already exists."
            exit 1
          fi

      - name: Create GitHub release
        if: steps.version.outputs.should_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DLL_PATH: ${{ steps.dll.outputs.path }}
        run: |
          gh release create "$VERSION" "$DLL_PATH" \
            --target "${{ github.sha }}" \
            --title "$VERSION" \
            --generate-notes
